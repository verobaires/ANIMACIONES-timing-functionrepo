<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timing Function</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
  <script src="https://kit.fontawesome.com/29c3be7601.js" crossorigin="anonymous"></script>
  <style>
    body {
      background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      background-size: cover;
      background-repeat: no-repeat;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

    }

    h1 {
      font-size: 3rem;
      text-align: center;
      padding: 1rem;
      font-weight: bold;
    }

    h2 {
      font-size: 1.2rem;
    }

    main{
   padding: 25px;
   height: 80vh;
   overflow-x: hidden
    }

    .row{
      height: 70px;
    }

    .fa-solid {
      font-size: 4.5rem;
      
    }

    /* Colores de cada animal */
    .fa-dove { color: rgb(190, 190, 3); }
    .fa-cat { color: rgb(5, 5, 100); }
    .fa-dog { color: rgb(73, 40, 2); }
    .fa-frog { color: green; }
    .fa-dragon { color: rgb(66, 61, 61); }
    .fa-cow { color: rgb(247, 119, 14); }
    .fa-horse { color: rgb(22, 21, 11); }

    /* Animación de la carrera */
    @keyframes carrera {
     from{
        transform: translate(0, -50%); /* arranca desde la izq, se centra verticalmente */
        }
        to{transform: translate(calc(100vw - 50px), -50%); /* se mueve a la derecha y descuenta el tamaño del icono */
        }
    }

    /* Configuración base para todos */
    .correr {
      display: inline-block;
      animation-name: carrera;
      animation-duration: 10s;
      animation-delay: 0.5s;    
      animation-iteration-count: 2;
      position: absolute;

     
    }

    /* Cada timing function */
    .linear   { animation-timing-function: linear; }
    .ease     { animation-timing-function: ease; }
    .ease-in  { animation-timing-function: ease-in; }
    .ease-out { animation-timing-function: ease-out; }
    .ease-in-out { animation-timing-function: ease-in-out; }
    .steps    { animation-timing-function: steps(4, end); }
    .cubic    { animation-timing-function: cubic-bezier(0.68, -0.55, 0.27, 1.55); }



    .lineaCarrera{
      position: relative;
       
    }
  </style>
</head>
<body>
  <header>
    <h1>Timing Function Race</h1>
  </header>

  <main>
    <section class="container m-3">
      <div class="row p-2 m-2 align-items-center">
        <div class="col-2"><h2>linear</h2></div>
        <div class="col-10 lineaCarrera"><i class="fa-solid fa-dove correr linear"></i></div>
      </div>

      <div class="row p-2 m-2 align-items-center">
        <div class="col-2"><h2>ease</h2></div>
        <div class="col-10 lineaCarrera" ><i class="fa-solid fa-cat correr ease"></i></div>
      </div>

      <div class="row p-2 m-2align-items-center">
        <div class="col-2"><h2>ease-in</h2></div>
        <div class="col-10 lineaCarrera"><i class="fa-solid fa-dog correr ease-in"></i></div>
      </div>

      <div class="row m-2 p-2 align-items-center">
        <div class="col-2"><h2>ease-out</h2></div>
        <div class="col-10 lineaCarrera"><i class="fa-solid fa-frog correr ease-out"></i></div>
      </div>

      <div class="row p-2 align-items-center">
        <div class="col-2"><h2>ease-in-out</h2></div>
        <div class="col-10 lineaCarrera"><i class="fa-solid fa-dragon correr ease-in-out"></i></div>
      </div>

      <div class="row p-2 m-2 align-items-center">
        <div class="col-2"><h2>steps(4,end)</h2></div>
        <div class="col-10 lineaCarrera"><i class="fa-solid fa-cow correr steps"></i></div>
      </div>

      <div class="row p-2 m-2 align-items-center">
        <div class="col-2"><h2>cubic-bezier</h2></div>
        <div class="col-10 lineaCarrera"><i class="fa-solid fa-horse correr cubic"></i></div>
      </div>
    </section>
  </main>

  <footer class="text-center p-3">
    <h2>Footer</h2>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
