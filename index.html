<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timing Function</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css">
  <script src="https://kit.fontawesome.com/29c3be7601.js" crossorigin="anonymous"></script>
  <style>
    body {
      background-image: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      background-size: cover;
      background-repeat: no-repeat;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;

    }

    h1 {
      font-size: 3rem;
      text-align: center;
      padding: 1rem;
      font-weight: bold;
    }

    h2 {
      font-size: 1.2rem;
    }

    main{
   padding: 25px;
   height: 80vh;
   overflow-x: hidden
    }

    .row{
      height: 70px;
    }

    .fa-solid {
      font-size: 4.5rem;
      
    }

    /* Colores de cada animal */
    .fa-dove { color: rgb(190, 190, 3); }
    .fa-cat { color: rgb(5, 5, 100); }
    .fa-dog { color: rgb(73, 40, 2); }
    .fa-frog { color: green; }
    .fa-dragon { color: rgb(66, 61, 61); }
    .fa-cow { color: rgb(247, 119, 14); }
    .fa-horse { color: rgb(22, 21, 11); }

    /* Animación de la carrera */
    @keyframes carrera {
      from {
        left: 0;
      }
      to {
        left: calc(100% - 1.25em);
      }
    }

    /* Configuración base para todos */
    .correr {
      display: inline-block;
      animation-name: carrera;
      animation-duration: 10s;
      animation-delay: 0.5s;    
      animation-iteration-count: 6;
      position: absolute;
      top: 50%;
      left: 0;
      width: 1.25em;
      transform: translateY(-50%);
      text-align: center;
    }

    /* Cada timing function */
    .linear   { animation-timing-function: linear; }
    .ease     { animation-timing-function: ease; }
    .ease-in  { animation-timing-function: ease-in; }
    .ease-out { animation-timing-function: ease-out; }
    .ease-in-out { animation-timing-function: ease-in-out; }
    .steps    { animation-timing-function: steps(4, end); }
    .cubic    { animation-timing-function: cubic-bezier(0.68, 0.05, 0.27, 0.95); }



    .lineaCarrera{
      position: relative;
       
    }

   
    body {
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255, 213, 128, 0.48), transparent 30%),
        radial-gradient(ellipse at 88% 78%, rgba(168, 218, 220, 0.62), transparent 34%),
        linear-gradient(135deg, #f7f2ff 0%, #edf7ff 52%, #fff8e9 100%);
      color: #25233a;
      font-family: "Trebuchet MS", Arial, Helvetica, sans-serif;
    }

    header {
      padding: 2.5rem 1rem 1rem;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #30264d;
      font-size: clamp(2.2rem, 6vw, 4rem);
      font-weight: 900;
      letter-spacing: -0.06em;
      text-shadow: 0 4px 0 rgba(255, 255, 255, 0.85);
    }

    .subtitulo {
      margin: 0.5rem 0 0;
      color: #716b86;
      font-size: 1rem;
    }

    main {
      height: auto;
      min-height: 0;
      padding: 1rem 1.25rem 2.5rem;
    }

    section.container {
      width: min(100%, 1040px);
      max-width: 1040px;
      margin: 0 auto !important;
      padding: 0;
    }

    .row {
      width: 100%;
      height: 88px;
      margin: 0 0 14px !important;
      padding: 0 1rem !important;
      border: 1px solid rgba(98, 85, 135, 0.12);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 8px 22px rgba(61, 52, 91, 0.08);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .row:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(61, 52, 91, 0.13);
    }

    .row > .col-2 {
      width: 23%;
      flex: 0 0 23%;
    }

    .row > .col-10 {
      width: 77%;
      flex: 0 0 77%;
    }

    .row h2 {
      display: inline-block;
      margin: 0;
      padding: 0.45rem 0.75rem;
      border-radius: 999px;
      background: #f1edff;
      color: #55448c;
      font-family: Consolas, "Courier New", monospace;
      font-size: clamp(0.72rem, 2vw, 1rem);
      font-weight: 700;
      white-space: nowrap;
    }

    .lineaCarrera {
      height: 100%;
      overflow: hidden;
      border-radius: 14px;
      background-color: #f8f7fc;
      background-image: radial-gradient(#d9d4e8 1.2px, transparent 1.2px);
      background-position: 0 50%;
      background-size: 14px 14px;
    }

    .fa-solid {
      font-size: 3.6rem;
      filter: drop-shadow(0 4px 2px rgba(37, 35, 58, 0.12));
    }

    .fa-dove { color: #e9a900; }
    .fa-cat { color: #5d5bd6; }
    .fa-dog { color: #a35d36; }
    .fa-frog { color: #39a66c; }
    .fa-dragon { color: #ed687b; }
    .fa-cow { color: #ed8a38; }
    .fa-horse { color: #74523e; }

    footer {
      padding: 0 1rem 2rem !important;
      color: #817b94;
    }

    footer h2 {
      margin: 0;
      font-size: 0.9rem;
      font-weight: 500;
    }

    @media (max-width: 600px) {
      header {
        padding-top: 1.75rem;
      }

      main {
        padding: 0.75rem 0.75rem 1.5rem;
      }

      .row {
        height: 76px;
        padding: 0 0.55rem !important;
        border-radius: 16px;
      }

      .row > .col-2 {
        width: 34%;
        flex-basis: 34%;
      }

      .row > .col-10 {
        width: 66%;
        flex-basis: 66%;
        padding-top: 10px;
      }

      .row h2 {
        padding: 0.4rem 0.5rem;
      }

      .fa-solid {
        font-size: 2.8rem;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Timing Function Race</h1>
    <p class="subtitulo">Una carrera para descubrir cómo se mueve cada timing function.</p>
  </header>

  <main>
    <section class="container m-3">
      <div class="row p-2 m-2 align-items-center">
        <div class="col-2"><h2>linear</h2></div>
        <div class="col-10 lineaCarrera"><i class="fa-solid fa-dove correr linear"></i></div>
      </div>

      <div class="row p-2 m-2 align-items-center">
        <div class="col-2"><h2>ease</h2></div>
        <div class="col-10 lineaCarrera" ><i class="fa-solid fa-cat correr ease"></i></div>
      </div>

        <div class="row p-2 m-2 align-items-center">
        <div class="col-2"><h2>ease-in</h2></div>
        <div class="col-10 lineaCarrera" ><i class="fa-solid fa-dog correr ease-in"></i></div>
      </div>

   
      <div class="row m-2 p-2 align-items-center">
        <div class="col-2"><h2>ease-out</h2></div>
        <div class="col-10 lineaCarrera"><i class="fa-solid fa-frog correr ease-out"></i></div>
      </div>

      <div class="row p-2 align-items-center">
        <div class="col-2"><h2>ease-in-out</h2></div>
        <div class="col-10 lineaCarrera"><i class="fa-solid fa-dragon correr ease-in-out"></i></div>
      </div>

      <div class="row p-2 m-2 align-items-center">
        <div class="col-2"><h2>steps(4,end)</h2></div>
        <div class="col-10 lineaCarrera"><i class="fa-solid fa-cow correr steps"></i></div>
      </div>

      <div class="row p-2 m-2 align-items-center">
        <div class="col-2"><h2>cubic-bezier</h2></div>
        <div class="col-10 lineaCarrera"><i class="fa-solid fa-horse correr cubic"></i></div>
      </div>
    </section>
  </main>

  <footer class="text-center p-3">
    <h2>2026</h2>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
